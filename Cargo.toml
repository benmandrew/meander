[package]
name = "meander-core"
edition.workspace = true
version.workspace = true
description = "Simulation of a meandering river channel and its floodplain"
repository.workspace = true
license.workspace = true
include = ["src/**", "examples/**", "LICENCE"]

[dependencies]

[workspace]
members = ["wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
repository = "https://github.com/benmandrew/meander"
license = "MIT"

[profile.release]
opt-level = 3
lto = true

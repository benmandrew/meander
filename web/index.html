<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meander</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<!-- Fetch the page's module chain at once; otherwise each waits for the
     file that imports it. The worker loads the WASM binary itself, and a
     page's preloads do not reach a worker. -->
<link rel="modulepreload" href="ui.js">
<link rel="modulepreload" href="snapshot.js">
<link rel="preload" href="fonts/iosevka-slab-extended-regular.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<svg id="bars"></svg>
<svg id="ground"></svg>
<svg id="view"></svg>
<div id="year"></div>
<div id="overlay">Loading…</div>
<aside id="panel" hidden>
  <header>
    <h1>Meander</h1>
    <button id="collapse" title="Hide controls">×</button>
  </header>
  <div class="buttons">
    <button id="play" title="Space">Pause</button>
    <button id="step" title="S: advance one second's worth">Step</button>
    <button id="reset" title="R">Reset</button>
    <button id="save" title="Download the current frame">Save SVG</button>
  </div>
  <div class="seed">
    <label for="seed">Seed</label>
    <input id="seed" type="number" min="0" step="1">
    <button id="reseed" title="New random seed">Random</button>
  </div>
  <div id="sliders"></div>
  <div class="tick">
    <label for="tick">Tick</label>
    <input id="tick" type="number" min="0" step="1" title="Steps since the reset, the warm-up's among them. Enter a tick to replay to it.">
    <button id="link" title="Copy a link that replays to this tick">Link</button>
  </div>
  <pre id="stats"></pre>
</aside>
<button id="expand" title="Show controls">☰</button>
<script type="module" src="main.js"></script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The dev shell pins the same toolchain as local work, so clippy's
      # lints match the pre-commit hook.
      - uses: cachix/install-nix-action@v31
      # The whole store, so the dev shell needs no downloads or builds until
      # the flake changes.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # Compiled dependencies. The toolchain comes from flake.lock, so a new
      # toolchain also starts a new cache.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: nix develop --command cargo fmt --all --check
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: nix develop --command cargo test --release -p meander-core
